name: pre-commit

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
      # 👇 Added step to install Terraform
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7

      - uses: pre-commit/action@v3.0.0